services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orders -d orders]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./application/backend
    environment:
      DB_HOST: db
      DB_NAME: orders
      DB_USER: orders
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      DEMO_TOKEN: ${DEMO_TOKEN:?set token}
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./application/frontend:/usr/share/nginx/html:ro
      - ./application/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
volumes:
  dbdata:
