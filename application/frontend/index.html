<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order portal</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#eef3f8;color:#17324d}section{background:white;padding:24px;border-radius:12px}input,button,select{padding:10px;margin:5px}pre{white-space:pre-wrap}</style><h1>Order management portal</h1><section><p>Local capstone demonstration</p><label>Demo token <input id="token" type="password"></label><button id="load">Load products and orders</button><p><select id="product" aria-label="Product"></select><input id="qty" type="number" min="1" max="100" value="1" aria-label="Quantity"><button id="create">Create order</button></p><pre id="result"></pre></section><script>
const el=id=>document.getElementById(id);async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+el('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}async function load(){const p=await api('products');el('product').replaceChildren(...p.map(x=>new Option(x.name+' — '+x.price,x.id)));el('result').textContent=JSON.stringify(await api('orders'),null,2)}async function run(fn){try{await fn()}catch(e){el('result').textContent=e.message}}el('load').onclick=()=>run(load);el('create').onclick=()=>run(async()=>{await api('orders',{product_id:Number(el('product').value),quantity:Number(el('qty').value)});await load()});</script></html>
